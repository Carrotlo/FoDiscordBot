name: FoDiscordBot
version: '${project.version}'
main: me.foesio.foDiscordBot.FoDiscordBot
api-version: '1.21'
authors: [ Foesio ]
description: Discord bot integration with linking, rewards, profiles, and leaderboards
softdepend: [ PlaceholderAPI, SkinsRestorer ]
commands:
  fodiscordbotadmin:
    description: Manage FoDiscordBot
    usage: /fodiscordbotadmin <version|reload|editor|resetrewards|resetleaderboards>
    aliases: [ discordbotadmin, fodiscord, fodiscordbot ]
  link:
    description: Generate a Discord link code
    usage: /link
  unlink:
    description: Unlink your Discord account
    usage: /unlink
  discord:
    description: Show the Discord invite link
    usage: /discord
permissions:
  fodiscordbot.admin:
    description: Reload and administrate FoDiscordBot
    default: op
  fodiscord.admin:
    description: Legacy FoDiscordBot admin permission
    default: op
    children:
      fodiscordbot.admin: true
  fodiscord.use:
    description: Use FoDiscordBot player commands
    default: true
